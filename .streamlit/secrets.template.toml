# ============================================================================
# STREAMLIT SECRETS TEMPLATE - For Local Development
# ============================================================================
# Copy this file to .streamlit/secrets.toml and fill in your local values
# NEVER commit secrets.toml to GitHub!

# ============================================================================
# LOCAL DEVELOPMENT (SQL Server Express)
# ============================================================================
MOI_SEI_SQL_SERVER = "JNPR-WIN-MPRZ09\\SQLEXPRESS"
MOI_SEI_SQL_DATABASE = "MoiSei"

# ============================================================================
# CLOUD DEPLOYMENT (Supabase PostgreSQL)
# ============================================================================
# Uncomment and fill these when deploying to Streamlit Cloud
# Get POSTGRES_URL from: Supabase Dashboard → Project Settings → Database → Connection String
# MOI_SEI_POSTGRES_URL = "postgresql://[user]:[password]@[host]:[port]/[database]?sslmode=require"

# ============================================================================
# WhatsApp API (Green API)
# ============================================================================
# Get from: https://green-api.com/en/my/settings/account
GREEN_API_ID_INSTANCE = "your_id_instance_here"
GREEN_API_TOKEN_INSTANCE = "your_token_instance_here"

# ============================================================================
# OpenAI / LiteLLM (Optional - for voice/AI features)
# ============================================================================
OPENAI_API_KEY = "your_openai_api_key_here"
LITELLM_API_KEY = "your_litellm_api_key_here"

# ============================================================================
# Admin Authentication (Optional - for security)
# ============================================================================
MOI_SEI_ADMIN_PASSWORD = "your_admin_password_here"
